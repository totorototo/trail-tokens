name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # theme.js is committed: fail when it does not match tokens.json.
      - run: npm run build
      - run: git diff --exit-code -- theme.js
      - run: npm test
